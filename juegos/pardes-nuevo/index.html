<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <!-- En iPhone, Safari no da pantalla completa a una página; guardada en la
       pantalla de inicio sí se abre sin barras. Esto es lo que lo permite. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pardés" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Pardés · Or Barak</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0d12; overflow: hidden; overscroll-behavior: none;
      font-family: monospace;
    }
    /* Fijo a la pantalla: con 100vh el iPhone mide de más y la parte de
       abajo del juego queda tapada por la barra del navegador. */
    #game {
      display: block; position: fixed; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated; touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./main.bfb867fe41.js"></script>
</body>
</html>
