<!--
  Copia de Hexterra para jugarse dentro de Or+.
  Original: https://github.com/bx44/hexterra
  Se copia sola (.github/workflows/sync-hexterra.yml). No la edites aquí:
  los cambios se hacen en bx44/hexterra.
  Unico cambio: se quito el enlace al manifiesto.
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176a73">
<!-- manifiesto retirado: aqui Hexterra vive dentro de Or+, no como app aparte -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hexterra">
<title>Hexterra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>

/* Layout: a chart-table — the island map is the hero, a slim ledger of players and your hand sits beside it (below it on phones). */
:root{
  --bg:#e9efee; --panel:#fbfdfc; --ink:#14262b; --muted:#5a6e73; --line:#cfdbda; --accent:#176a73; --accent-ink:#ffffff; --hl:#f0b429; --bad:#b4372a; --soft:#dfe8e7;
  --sea1:#2f6e8f; --sea2:#2a6584;
  --t-trade:#d9a520; --t-politics:#2f63c4; --t-science:#2f8f4a;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e; --panel:#152529; --ink:#e4eeee; --muted:#93a8ab; --line:#26403f; --accent:#4bb1ba; --accent-ink:#06282c; --hl:#f4c04a; --bad:#ef7a6b; --soft:#1c3135;
  --sea1:#1f4f69; --sea2:#1b4760; --t-trade:#e8b93a; --t-politics:#5b8ee6; --t-science:#4fb46a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --panel:#152529; --ink:#e4eeee; --muted:#93a8ab; --line:#26403f; --accent:#4bb1ba; --accent-ink:#06282c; --hl:#f4c04a; --bad:#ef7a6b; --soft:#1c3135;
  --sea1:#1f4f69; --sea2:#1b4760; --t-trade:#e8b93a; --t-politics:#5b8ee6; --t-science:#4fb46a; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.on{background:var(--hl);color:#2a1d00;border-color:var(--hl)}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}

/* home */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand h1{font-size:clamp(34px,7vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted)}
.home{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.home{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px}
.mode b{font-family:var(--f-display);font-size:17px}
.mode span{font-weight:400;font-size:12.5px;color:var(--muted)}
.mode.sel{border:2px solid var(--accent);background:var(--soft)}
.toggle{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px}
.toggle .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:grid;place-items:center;font-weight:900;color:var(--accent-ink)}
.toggle.sel .box{background:var(--accent)}
.toggle.sel{border:2px solid var(--accent);background:var(--soft)}
.toggle span{font-weight:400;font-size:12.5px;color:var(--muted)}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;font-weight:600}
.code{font-family:var(--f-display);letter-spacing:.12em;font-weight:800}

/* lobby pieces */
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pl.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);flex:none;display:inline-block}
.pl .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--hl);color:#2a1d00;margin-left:4px}
.lobbycode{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,12vw,72px);letter-spacing:.14em;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;max-width:min(92vw,480px);text-align:center}
.ic{display:block;flex:none}

/* ===== in-game: one screen, no page scroll ===== */
body.ingame{padding:0;overflow:hidden;height:100%}
body.ingame #app{max-width:none;height:100dvh;height:100vh;height:100dvh}
.g{height:100%;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));min-height:0}
.gwide{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0}
.gwide .wb{border-radius:0;height:100%}
.gwide .g{border-left:1px solid var(--line);background:var(--bg)}
.grow{flex:1}
.gtop{display:flex;align-items:center;gap:8px;min-height:44px}
.iconb{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px;flex:none}
.iconb.on{background:var(--hl);color:#2a1d00;border-color:var(--hl)}
.me{display:flex;align-items:center;gap:7px;min-width:0}
.me .dot{width:18px;height:18px}
.me .mv{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.me .mv small{font-size:13px;color:var(--muted);font-weight:700}
.me .mn{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw}
.dice{display:flex;gap:3px;flex:none}
.dice svg{display:block}
.timer{position:relative;display:grid;place-items:center;flex:none}
.timer svg{position:absolute;inset:0}
.timer .arc{transition:stroke-dashoffset .25s linear}
.timer b{position:relative;font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
.timer.low .arc{stroke:var(--bad)}
.timer.low b{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.timer.low{animation:beat 1s ease-in-out infinite}}
@keyframes beat{50%{transform:scale(1.08)}}
.barbmini{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.barbmini .bt{display:flex;gap:2px}
.barbmini .bt i{width:6px;height:10px;border-radius:2px;background:var(--line);display:block}
.barbmini .bt i.f{background:#3b2f3a}
.barbmini .bs{font-size:11px;font-weight:800;color:var(--muted)}
.barbmini .bs.bad{color:var(--bad)}
.gstat{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:15px;line-height:1.2;min-height:44px}
.gstat.me{border:2px solid var(--hl);background:color-mix(in srgb,var(--hl) 14%,var(--panel))}
.gstat span{flex:1;min-width:0}
.sm{padding:5px 9px;font-size:13px;display:inline-flex;align-items:center;gap:4px;border-radius:9px}
.gmid{flex:1;min-height:0}
.boardbox{background:var(--sea2);border-radius:16px;overflow:hidden;position:relative;touch-action:none}
.boardbox>svg{display:block;width:100%;height:100%}
.gmid.boardbox{display:flex}
.ctrlboard{outline:3px solid var(--hl);outline-offset:-3px}
.handwrap{display:flex;align-items:center}
.handwrap .hand{width:100%}
/* hand */
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.hand.h8{grid-template-columns:repeat(4,minmax(0,1fr))}
.hand.mini,.hand.mini.h8{grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:4px}
.rc{border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rc svg{width:34px;height:34px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.rc b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rc span{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;opacity:.9}
.rc.zero{opacity:.35}
.hand.mini .rc{flex-direction:row;justify-content:center;padding:4px 2px;gap:2px;border-radius:9px}
.hand.mini .rc svg{width:20px;height:20px}
.hand.mini .rc b{font-size:17px}
.r-wood{background:#2f6b33}.r-brick{background:#b5542e}.r-sheep{background:#79a83b}.r-wheat{background:#d6a51f;color:#3a2a00}.r-ore{background:#69737d}.r-gold{background:#c9961a;color:#3a2a00}
.r-paper{background:#4e8c43}.r-cloth{background:#a9cc66;color:#22380c}.r-coin{background:#9aa3ad;color:#1c2329}
/* dock */
.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.db{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-radius:14px;min-height:72px;--btn:var(--panel)}
.db .dl{font-size:12px;font-weight:800;line-height:1.1;text-align:center}
.db.on{background:var(--hl);color:#2a1d00;border-color:var(--hl);--btn:var(--hl)}
.db.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);--btn:var(--accent)}
.db.wide{grid-column:1/-1;flex-direction:row;min-height:56px;gap:10px}
.db.wide .dl{font-size:17px}
.db.big{min-height:76px}
.db.big .dl{font-size:20px}
.db:disabled{opacity:.32}
.pipr{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:56px}
.pipr i{width:8px;height:8px;border-radius:2.5px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.badge2{position:absolute;top:4px;right:6px;font-size:11px;font-weight:900;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hl);color:#2a1d00;display:grid;place-items:center}
/* offer strip */
.offer{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:2px dashed var(--accent);background:var(--panel);flex-wrap:wrap}
.offer .og{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:13px;font-weight:800;color:var(--muted)}
.offer .og .pipr{max-width:none}
.offer .og .pipr i{width:12px;height:12px}
.offer .oa{display:flex;gap:6px}
/* table screen */
.scr{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,27vw)}
@media (max-width:760px){.scr{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}}
.sboard{border-radius:0;height:100%}
.sside{display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px 16px;min-height:0;overflow:hidden;border-left:1px solid var(--line)}
.shead{display:flex;align-items:center;gap:10px}
.brandmini{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px}
.shead .code{font-size:20px;color:var(--accent)}
.sstat{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.sstat .stx{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,1.6vw,26px);line-height:1.15;min-width:0}
.sside .players{gap:6px}
.sside .pl{grid-template-columns:16px minmax(0,1fr) auto;padding:9px 12px}
.sside .pl .nm{font-size:clamp(15px,1.25vw,20px)}
.pm{min-width:0}
.st{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.st span{display:inline-flex;align-items:center;gap:3px}
.st .tr{gap:2px}
.st .tr i{font-style:normal;color:#fff;font-size:11px;min-width:16px;text-align:center;border-radius:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--hl);color:#2a1d00;margin-left:6px;vertical-align:2px}
.vp{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,2.3vw,36px);font-variant-numeric:tabular-nums}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:0}
.sside .log{flex:1}
.log div:first-child{color:var(--ink);font-weight:700}
.offer.big .og{font-size:15px}
.barb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.track span{height:28px;border-radius:7px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.track span.ship{background:#3b2f3a;color:#fff}
.track span.land{background:#b5542e;color:#fff}
.bline{display:flex;gap:14px;font-weight:800;font-size:14px;flex-wrap:wrap}
.bline span{display:inline-flex;align-items:center;gap:5px}
.good{color:var(--t-science)}.bad{color:var(--bad)}
/* board svg */
.tgt{cursor:pointer}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);width:min(560px,100%);border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
.sh{display:flex;align-items:center;gap:10px}
.sh h3{flex:1;font-size:20px}
.desc{margin:0;font-size:13.5px;color:var(--muted)}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
button.big{min-height:54px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:40px minmax(0,1fr) 44px 34px 44px;gap:8px;align-items:center}
.stp .sk{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.stp .sk svg{width:28px;height:28px}
.stp .sl{font-weight:800;font-size:14px;display:flex;flex-direction:column;line-height:1.1}
.stp .sl small{font-weight:600;color:var(--muted);font-size:12px}
.stp .q{text-align:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.stp button{height:44px;padding:0;font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .stp{grid-template-columns:34px 38px 26px 38px}
.two .stp .sl{display:none}
.two .stp .sk{width:34px;height:34px}
.two .stp button{height:38px}
.rpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.rp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:#fff;border:3px solid transparent;border-radius:12px}
.rp svg{width:30px;height:30px}
.rp span{font-size:12px;font-weight:800}
.rp.on{border-color:var(--hl);box-shadow:0 0 0 2px var(--panel) inset}
.rp.r-wheat,.rp.r-gold{color:#3a2a00}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--hl);color:#2a1d00;border-color:var(--hl)}
.plist{display:flex;flex-direction:column;gap:6px}
.pbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
.pbtn b{flex:1}
.pbtn span{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:700}
.pbtn.cur{border-color:var(--accent)}
.pbtn .vp{font-size:22px;color:var(--ink)}
.clist{display:flex;flex-direction:column;gap:8px}
.cc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-left:6px solid var(--line);border-radius:12px}
.cc span{font-weight:500;font-size:13px;color:var(--muted)}
.pc-trade{border-left-color:var(--t-trade)}.pc-politics{border-left-color:var(--t-politics)}.pc-science{border-left-color:var(--t-science)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px;border-radius:14px;--btn:var(--panel)}
.tile span{font-weight:800;font-size:13px}
.imps{display:flex;flex-direction:column;gap:8px}
.imp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:6px solid var(--tc)}
.imp .it{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.imp .it small{color:var(--muted);font-size:12px}
.lvl{display:flex;gap:4px}
.lvl i{width:26px;height:10px;border-radius:4px;background:var(--line);display:block}
.lvl i.f{background:var(--tc)}
.lvl i.m3{outline:2px solid var(--tc);outline-offset:1px}
.up{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px}
.up .pipr{max-width:46px}
.max{font-weight:800;color:var(--muted)}
.dsel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dsel button{padding:4px;display:grid;place-items:center;border:3px solid transparent}
.dsel button.on{border-color:var(--hl)}
.sheet .log{max-height:160px;overflow:auto}
.net{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.net.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.qr img,.qr canvas{width:clamp(140px,18vw,240px)!important;height:auto!important}
.toggle{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px}

<script>
/* ==== ENGINE START ==== */
const RES=['wood','brick','sheep','wheat','ore'];
const COM=['paper','cloth','coin'];
const ALL=[...RES,...COM];
const RES_ES={wood:'Madera',brick:'Arcilla',sheep:'Lana',wheat:'Trigo',ore:'Piedra',paper:'Papel',cloth:'Tela',coin:'Moneda',gold:'Oro',desert:'Desierto',sea:'Mar'};
const COMOF={wood:'paper',sheep:'cloth',ore:'coin'};
const TRACKS=['trade','politics','science'];
const TRACK_COM={trade:'cloth',politics:'coin',science:'paper'};
const TRACK_ES={trade:'Comercio',politics:'Política',science:'Ciencia'};
const TRACK_L3={trade:'Casa de comercio: mercancías 2:1 con el banco',politics:'Fortaleza: puedes tener caballeros poderosos',science:'Acueducto: si una tirada no te da nada, eliges 1 recurso'};
const EVENT_ES={ship:'Barco bárbaro',trade:'Puerta amarilla',politics:'Puerta azul',science:'Puerta verde'};
const COST={road:{wood:1,brick:1},ship:{wood:1,sheep:1},settlement:{wood:1,brick:1,sheep:1,wheat:1},city:{wheat:2,ore:3},dev:{sheep:1,wheat:1,ore:1},
  knight:{sheep:1,ore:1},promote:{sheep:1,ore:1},activate:{wheat:1},wall:{brick:2}};
const LIMIT={settlement:5,city:4,road:15,ship:15};
/* maps: the shape of the land, and whether there is sea to sail with islands and gold */
const MODES={
  base:{name:'Isla clásica',desc:'19 losetas · sin oro',target:10},
  grande:{name:'Isla grande',desc:'30 losetas · 11 puertos · sin oro',target:10,big:true},
  mar:{name:'Archipiélago',desc:'isla de 19 + 5 islas · con oro',target:13,sea:true,needShips:true},
  margrande:{name:'Gran archipiélago',desc:'isla de 30 + 6 islas · con oro',target:14,big:true,sea:true,needShips:true}
};
/* rules = map + the mechanics switched on. Older games had no switches: their map implied them */
function RULES(S){
  const m=MODES[S.mode]||MODES.base;
  const set=S.ext56!=null,big=set?!!S.ext56:!!m.big;
  const ships=m.needShips?true:(S.ships!=null?!!S.ships:!!m.sea);
  /* the special building phase only runs in games that chose the 5–6 rules; games from before keep playing as they started */
  return{...m,ext56:set&&!!S.ext56,bigSupply:big,ships,min:2,max:big?6:4,bank:big?24:19};
}
const defaultTarget=S=>MODES[S.mode].target+(S.ck?3:0);
const targetOf=S=>(S.cfg&&S.cfg.vp)||defaultTarget(S);
const COLORS=[{c:'#d63a2a',n:'Rojo'},{c:'#2d68d1',n:'Azul'},{c:'#ec8a17',n:'Naranja'},{c:'#f4f1e8',n:'Blanco'},{c:'#2b9a55',n:'Verde'},{c:'#7b4f9e',n:'Morado'}];
const DEV_ES={knight:'Caballero',vp:'Punto de victoria',road:'Construcción de caminos',plenty:'Año de abundancia',mono:'Monopolio'};
const DIRS=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
/* progress cards: color, count, name, short rule, what the play needs */
const PROG={
  alchemist:{c:'science',n:2,es:'Alquimista',d:'Antes de tirar, eliges el valor de los dos dados de producción.',need:'dice'},
  inventor:{c:'science',n:2,es:'Inventor',d:'Intercambia los números de dos losetas (no 2, 12, 6 ni 8).',need:'hex2'},
  crane:{c:'science',n:2,es:'Grúa',d:'Tu próxima mejora de ciudad este turno cuesta 1 mercancía menos.'},
  roadb:{c:'science',n:2,es:'Construcción de caminos',d:'Construye 2 caminos o barcos gratis.'},
  engineer:{c:'science',n:1,es:'Ingeniero',d:'Construye una muralla gratis.'},
  irrigation:{c:'science',n:2,es:'Irrigación',d:'Recibe 2 Trigo por cada campo junto a tus construcciones.'},
  medicine:{c:'science',n:2,es:'Medicina',d:'Tu próxima ciudad este turno cuesta 2 Piedra + 1 Trigo.'},
  mining:{c:'science',n:2,es:'Minería',d:'Recibe 2 Piedra por cada montaña junto a tus construcciones.'},
  smith:{c:'science',n:2,es:'Herrero',d:'Promueve hasta 2 caballeros gratis.'},
  printer:{c:'science',n:1,es:'Imprenta',d:'+1 punto de victoria.',vp:true},
  bishop:{c:'politics',n:2,es:'Obispo',d:'Mueve al ladrón y roba 1 carta a cada jugador junto a esa loseta.'},
  constitution:{c:'politics',n:1,es:'Constitución',d:'+1 punto de victoria.',vp:true},
  deserter:{c:'politics',n:2,es:'Desertor',d:'Un rival quita su caballero más débil; tú colocas uno igual gratis.',need:'player'},
  diplomat:{c:'politics',n:2,es:'Diplomático',d:'Quita un camino abierto de un rival, o mueve uno tuyo a otro lugar.',need:'edge'},
  intrigue:{c:'politics',n:2,es:'Intriga',d:'Desplaza un caballero rival que toque tus caminos.',need:'knight'},
  saboteur:{c:'politics',n:2,es:'Saboteador',d:'Quien tenga tantos o más puntos que tú descarta la mitad de su mano, a su elección.'},
  spy:{c:'politics',n:3,es:'Espía',d:'Roba una carta de progreso a un rival.',need:'player'},
  warlord:{c:'politics',n:2,es:'Señor de la guerra',d:'Activa gratis todos tus caballeros.'},
  wedding:{c:'politics',n:2,es:'Boda',d:'Cada rival con más puntos te da 2 cartas.'},
  harbor:{c:'trade',n:2,es:'Puerto comercial',d:'Ofreces 1 recurso a cada rival y cada uno te da 1 mercancía de su elección.',need:'offers'},
  mmerchant:{c:'trade',n:2,es:'Mercader maestro',d:'Toma 2 cartas de un rival con más puntos.',need:'player'},
  merchant:{c:'trade',n:6,es:'Mercader',d:'Pon al mercader en una loseta junto a ti: +1 punto y 2:1 de ese recurso.',need:'hex'},
  fleet:{c:'trade',n:2,es:'Flota mercante',d:'Este turno cambias 2:1 un recurso o mercancía que elijas.',need:'card'},
  resmono:{c:'trade',n:4,es:'Monopolio de recursos',d:'Cada rival te da hasta 2 de un recurso.',need:'res'},
  trademono:{c:'trade',n:2,es:'Monopolio comercial',d:'Cada rival te da 1 de una mercancía.',need:'com'}
};
const KNAME=['','básico','fuerte','poderoso'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hexDist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(-q-r));
const tally=o=>Object.entries(o).flatMap(([k,n])=>Array(n).fill(k));

const BCACHE={};
/* gen 2+: gold fields never get 2, 12, 6 or 8. Older games keep gen 1 so their board never changes */
function board(S){const g=S.gen||1,k=S.mode+':'+S.seed+':'+g;return BCACHE[k]||(BCACHE[k]=genBoard(S.mode,S.seed,g))}
/* number tokens can be swapped by the Inventor, so read numbers through this */
const numOf=(S,B,h)=>S.nums&&S.nums[h]!=null?S.nums[h]:B.hexes[h].num;

function genBoard(mode,seed,gen){
  const rnd=mulberry32(seed);
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const key=(q,r)=>q+','+r;
  const land=[];
  const BIG=mode==='grande'||mode==='margrande',SEA=mode==='mar'||mode==='margrande';
  if(BIG){for(let r=-3;r<=3;r++)for(let q=Math.max(-3,-3-r)+1;q<=Math.min(3,3-r);q++)land.push({q,r,isl:0})}
  else{for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(hexDist(q,r)<=2)land.push({q,r,isl:0})}
  if(mode==='margrande'){[[[-3,-2],[-2,-3]],[[3,-5],[4,-5]],[[5,-2],[5,-1]],[[3,2],[2,3]],[[-2,5],[-3,5]],[[-5,3],[-5,2]]].forEach((g,i)=>g.forEach(([q,r])=>land.push({q,r,isl:i+1})))}
  if(mode==='mar'){[[[4,-4],[3,-4]],[[4,0],[4,-1]],[[-4,4],[-3,4]],[[-4,0],[-4,1]],[[0,4],[1,3]]].forEach((g,i)=>g.forEach(([q,r])=>land.push({q,r,isl:i+1})))}
  const L=new Set(land.map(h=>key(h.q,h.r)));
  const sea=[];
  if(SEA){const R=mode==='margrande'?5:4;for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(hexDist(q,r)<=R&&!L.has(key(q,r)))sea.push({q,r})}
  else{const seen=new Set();land.forEach(h=>DIRS.forEach(([dq,dr])=>{const k=key(h.q+dq,h.r+dr);if(!L.has(k)&&!seen.has(k)){seen.add(k);sea.push({q:h.q+dq,r:h.r+dr})}}))}
  const mainT=sh(BIG?tally({wood:6,brick:5,sheep:6,wheat:6,ore:5,desert:2}):tally({wood:4,brick:3,sheep:4,wheat:4,ore:3,desert:1}));
  const islT=sh(tally(mode==='margrande'?{gold:2,wood:2,brick:2,sheep:2,wheat:2,ore:2}:{gold:2,wood:2,brick:2,sheep:1,wheat:1,ore:2}));
  const hexes=[];
  land.forEach(h=>hexes.push({q:h.q,r:h.r,isl:h.isl,type:h.isl===0?mainT.pop():islT.pop()}));
  sea.forEach(h=>hexes.push({q:h.q,r:h.r,isl:-1,type:'sea'}));
  let nums=BIG?[2,2,3,3,3,4,4,4,5,5,5,6,6,6,8,8,8,9,9,9,10,10,10,11,11,11,12,12]:[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
  if(mode==='mar')nums=nums.concat([2,3,4,5,6,8,9,10,11,12]);
  if(mode==='margrande')nums=nums.concat([2,3,4,5,6,8,9,10,11,12,4,10]);
  const prod=hexes.filter(h=>h.type!=='sea'&&h.type!=='desert');
  const idx=new Map(hexes.map((h,i)=>[key(h.q,h.r),i]));
  const hot=n=>n===6||n===8;
  for(let t=0;t<1500;t++){
    sh(nums);prod.forEach((h,i)=>h.num=nums[i]);
    let ok=true;
    for(const h of prod){if(!hot(h.num))continue;for(const[dq,dr]of DIRS){const j=idx.get(key(h.q+dq,h.r+dr));if(j!=null&&hot(hexes[j].num)){ok=false;break}}if(!ok)break}
    if(ok&&gen>=2)for(const h of prod)if(h.type==='gold'&&[2,12,6,8].includes(h.num)){ok=false;break}
    if(ok)break;
  }
  const R3=Math.sqrt(3),verts=[],vmap=new Map(),edges=[],emap=new Map();
  const vk=(x,y)=>Math.round(x*1000)+'_'+Math.round(y*1000);
  hexes.forEach((h,hi)=>{
    h.x=R3*(h.q+h.r/2);h.y=1.5*h.r;h.v=[];
    const include=SEA||h.type!=='sea';
    const cs=[];
    for(let i=0;i<6;i++){
      const an=Math.PI/180*(60*i-30),x=h.x+Math.cos(an),y=h.y+Math.sin(an),k=vk(x,y);
      let vi=vmap.get(k);
      if(vi==null){if(!include){cs.push(null);continue}vi=verts.length;vmap.set(k,vi);verts.push({x,y,h:[],adj:[],e:[]})}
      cs.push(vi);
      if(!verts[vi].h.includes(hi))verts[vi].h.push(hi);
      h.v.push(vi);
    }
    for(let i=0;i<6;i++){
      const a=cs[i],b=cs[(i+1)%6];if(a==null||b==null)continue;
      const lo=Math.min(a,b),hi2=Math.max(a,b),k=lo+'-'+hi2;
      let ei=emap.get(k);
      if(ei==null){if(!include)continue;ei=edges.length;emap.set(k,ei);edges.push({a:lo,b:hi2,h:[]});verts[a].adj.push(b);verts[b].adj.push(a);verts[a].e.push(ei);verts[b].e.push(ei)}
      edges[ei].h.push(hi);
    }
  });
  verts.forEach(v=>{const lh=v.h.filter(i=>hexes[i].type!=='sea');v.land=lh.length>0;v.isl=lh.length?hexes[lh[0]].isl:-1});
  edges.forEach(e=>{e.land=e.h.some(i=>hexes[i].type!=='sea');e.sea=e.h.length<2||e.h.some(i=>hexes[i].type==='sea');e.x=(verts[e.a].x+verts[e.b].x)/2;e.y=(verts[e.a].y+verts[e.b].y)/2});
  const mainH=hexes.filter(h=>h.isl===0);
  const cx=mainH.reduce((s,h)=>s+h.x,0)/mainH.length,cy=mainH.reduce((s,h)=>s+h.y,0)/mainH.length;
  const coast=edges.map((e,i)=>i).filter(i=>{const e=edges[i];return e.h.some(j=>hexes[j].isl===0)&&e.h.some(j=>hexes[j].type==='sea')});
  coast.sort((a,b)=>Math.atan2(edges[a].y-cy,edges[a].x-cx)-Math.atan2(edges[b].y-cy,edges[b].x-cx));
  const NP=BIG?11:9;
  const ptypes=sh(BIG?['any','any','any','any','any','wood','brick','sheep','wheat','ore','sheep']:['any','any','any','any','wood','brick','sheep','wheat','ore']);
  const off=rnd()*coast.length/NP,ports=[];
  for(let i=0;i<NP;i++){
    const ei=coast[Math.floor(off+i*coast.length/NP)%coast.length],e=edges[ei];
    const sh2=hexes[e.h.find(j=>hexes[j].type==='sea')];
    const type=ptypes[i];
    ports.push({e:ei,type,x:e.x+(sh2.x-e.x)*.62,y:e.y+(sh2.y-e.y)*.62});
    verts[e.a].port=type;verts[e.b].port=type;
  }
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  hexes.forEach(h=>{x0=Math.min(x0,h.x-R3/2);x1=Math.max(x1,h.x+R3/2);y0=Math.min(y0,h.y-1);y1=Math.max(y1,h.y+1)});
  const robber=hexes.findIndex(h=>h.type==='desert');
  return{hexes,verts,edges,ports,robber,bounds:{x0,x1,y0,y1}};
}

/* ---- helpers ---- */
const keysOf=S=>S&&S.ck?ALL:RES;
const sumRes=r=>ALL.reduce((s,k)=>s+((r&&r[k])||0),0);
const hasRes=(r,c)=>Object.entries(c).every(([k,n])=>(r[k]||0)>=n);
function countPieces(S,pi){
  const c={settlement:0,city:0,road:0,ship:0,wall:0,k1:0,k2:0,k3:0};
  for(const b of Object.values(S.build))if(b.p===pi){c[b.t]++;if(b.wall)c.wall++}
  for(const l of Object.values(S.lines))if(l.p===pi)c[l.t]++;
  for(const k of Object.values(S.knights||{}))if(k.p===pi)c['k'+k.lvl]++;
  return c;
}
function vpOf(S,pi,full){
  const c=countPieces(S,pi),P=S.players[pi];
  let v=c.settlement+2*c.city;
  if(S.longest===pi)v+=2;
  if(S.army===pi)v+=2;
  v+=2*((P.islands||[]).length);
  if(S.ck){
    for(const b of Object.values(S.build))if(b.p===pi&&b.metro)v+=2;
    v+=(P.vpc||[]).length;
    if(S.merchant&&S.merchant.p===pi)v+=1;
  }
  if(full)v+=[...(P.dev||[]),...(P.newDev||[])].filter(d=>d==='vp').length;
  return v;
}
const handLimit=(S,pi)=>((S.cfg&&S.cfg.discard)||7)+(S.ck?2*countPieces(S,pi).wall:0);
/* friendly robber: no blocking a hex that touches a player with 2 or fewer visible points */
function robberOK(S,B,h,pi){const H=B.hexes[h];if(!H||H.type==='sea'||h===S.robber)return false;if(!(S.cfg&&S.cfg.friendly))return true;return !H.v.some(v=>{const b=S.build[v];return b&&b.p!==pi&&vpOf(S,b.p,false)<=2})}
function robberSpots(S,B,pi){const all=B.hexes.map((h,i)=>i).filter(i=>robberOK(S,B,i,pi));return all.length?all:B.hexes.map((h,i)=>i).filter(i=>B.hexes[i].type==='desert'&&i!==S.robber).concat(all)}
const enemyAt=(S,v,pi)=>{const b=S.build[v];if(b&&b.p!==pi)return true;const k=S.knights&&S.knights[v];return !!(k&&k.p!==pi)};
function canSettle(S,B,v,pi,setup){
  const V=B.verts[v];
  if(!V||!V.land||S.build[v]||(S.knights&&S.knights[v]))return false;
  if(V.adj.some(a=>S.build[a]))return false;
  if(setup)return !RULES(S).ships||V.isl===0;
  return V.e.some(e=>S.lines[e]&&S.lines[e].p===pi);
}
function canLine(S,B,e,pi,kind,setupV){
  const E=B.edges[e];
  if(!E||S.lines[e])return false;
  if(kind==='road'&&!E.land)return false;
  if(kind==='ship'&&(!RULES(S).ships||!E.sea))return false;
  if(setupV!=null)return E.a===setupV||E.b===setupV;
  for(const v of[E.a,E.b]){
    const b=S.build[v];
    if(b&&b.p===pi)return true;
    if(enemyAt(S,v,pi))continue;
    if(B.verts[v].e.some(o=>o!==e&&S.lines[o]&&S.lines[o].p===pi&&S.lines[o].t===kind))return true;
  }
  return false;
}
function canCity(S,v,pi){const b=S.build[v];return !!(b&&b.p===pi&&b.t==='settlement')}
function ratioFor(S,B,pi,res){
  let r=4;
  const isCom=COM.includes(res);
  for(const[v,b]of Object.entries(S.build)){if(b.p!==pi)continue;const p=B.verts[v].port;if(p==='any')r=Math.min(r,3);else if(p===res)r=2}
  if(S.ck){
    if(isCom&&S.players[pi].imp&&S.players[pi].imp.trade>=3)r=2;
    if(S.merchant&&S.merchant.p===pi&&B.hexes[S.merchant.h].type===res)r=2;
    if(S.fleet&&S.fleet.p===pi&&S.fleet.res===res)r=2;
  }
  return r;
}
function longestFor(S,B,pi){
  const at={};let any=false;
  for(const[e,l]of Object.entries(S.lines)){if(l.p!==pi)continue;any=true;const E=B.edges[e];(at[E.a]=at[E.a]||[]).push([+e,l.t]);(at[E.b]=at[E.b]||[]).push([+e,l.t])}
  if(!any)return 0;
  const used=new Set();let best=0;
  const dfs=(v,len,lt)=>{
    if(len>best)best=len;
    if(len>0&&enemyAt(S,v,pi))return;
    const b=S.build[v],own=b&&b.p===pi;
    for(const[e,t]of at[v]||[]){
      if(used.has(e))continue;
      if(lt&&t!==lt&&!own)continue;
      used.add(e);const E=B.edges[e];dfs(E.a===v?E.b:E.a,len+1,t);used.delete(e);
    }
  };
  Object.keys(at).forEach(v=>dfs(+v,0,null));
  return best;
}
function recalcLongest(S,B,log){
  const L=S.players.map((p,i)=>longestFor(S,B,i));S.roadLen=L;
  const h=S.longest,max=Math.max(...L);
  let n;
  if(max<5)n=null;
  else if(h!=null&&L[h]===max)n=h;
  else{const tops=L.map((l,i)=>l===max?i:-1).filter(i=>i>=0);n=tops.length===1?tops[0]:null}
  if(n!==h){S.longest=n;if(n!=null)log(`${S.players[n].name} tiene la ruta más larga (${max})`);else if(h!=null)log(`Nadie tiene la ruta más larga ahora`)}
}
/* vertices a player's knight may stand on: empty, touching one of their lines */
function knightSpot(S,B,v,pi){
  const V=B.verts[v];
  if(!V||!V.land||S.build[v]||S.knights[v])return false;
  return V.e.some(e=>S.lines[e]&&S.lines[e].p===pi);
}
/* vertices reachable from v along the player's own lines, not passing other players' pieces */
function reachable(S,B,v,pi){
  const seen=new Set([v]),q=[v],out=[];
  while(q.length){
    const x=q.shift();
    for(const e of B.verts[x].e){
      if(!S.lines[e]||S.lines[e].p!==pi)continue;
      const E=B.edges[e],y=E.a===x?E.b:E.a;
      if(seen.has(y))continue;seen.add(y);
      out.push(y);
      if(!enemyAt(S,y,pi)&&!(S.build[y]))q.push(y);
      else if(S.build[y]&&S.build[y].p===pi)q.push(y);
    }
  }
  return out;
}
function knightMoves(S,B,v,pi){
  const k=S.knights[v];
  return reachable(S,B,v,pi).filter(y=>{
    if(S.build[y])return false;
    const o=S.knights[y];
    if(!o)return B.verts[y].land;
    return o.p!==pi&&o.lvl<k.lvl;
  });
}

/* a progress card that would do nothing right now is not spent; this says why (or null if it can be played) */
function progBlock(S,B,pi,c){
  const P=S.players[pi],pcs=countPieces(S,pi),mine=Object.values(S.build).filter(b=>b.p===pi),ks=Object.values(S.knights||{}).filter(k=>k.p===pi);
  const opp=S.players.map((p,j)=>j).filter(j=>j!==pi),myVP=vpOf(S,pi,false);
  switch(c){
    case'engineer':
      if(!mine.some(b=>b.t==='city'))return'No puedes usar el Ingeniero: no tienes ninguna ciudad para la muralla.';
      if(pcs.wall>=3||!mine.some(b=>b.t==='city'&&!b.wall))return'No puedes usar el Ingeniero: tus ciudades ya tienen muralla.';
      return null;
    case'medicine':
      if(!mine.some(b=>b.t==='settlement'))return'No puedes usar la Medicina: no tienes poblados para convertir en ciudad.';
      if(pcs.city>=4)return'No puedes usar la Medicina: ya usaste tus 4 ciudades.';
      return null;
    case'crane':
      if(!mine.some(b=>b.t==='city'))return'No puedes usar la Grúa: necesitas una ciudad para mejorar.';
      if(TRACKS.every(t=>P.imp[t]>=5))return'No puedes usar la Grúa: tus mejoras ya están al máximo.';
      return null;
    case'smith':
      if(!ks.some(k=>k.lvl<(P.imp.politics>=3?3:2)))return'No puedes usar el Herrero: no tienes caballeros que se puedan promover.';
      return null;
    case'warlord':
      if(!ks.some(k=>!k.active))return'No puedes usar el Señor de la guerra: no tienes caballeros inactivos.';
      return null;
    case'roadb':
      if(!B.edges.some((e,j)=>canLine(S,B,j,pi,'road',null)||(RULES(S).ships&&canLine(S,B,j,pi,'ship',null))))return'No puedes usar Construcción de caminos: no hay dónde construir.';
      return null;
    case'irrigation':case'mining':{
      const type=c==='irrigation'?'wheat':'ore';
      if(!B.hexes.some(h=>h.type===type&&h.v.some(v=>S.build[v]&&S.build[v].p===pi)))return`No puedes usar ${PROG[c].es}: no tienes construcciones junto a ${c==='irrigation'?'campos de trigo':'montañas'}.`;
      return null}
    case'merchant':
      if(!B.hexes.some(h=>RES.includes(h.type)&&h.v.some(v=>S.build[v]&&S.build[v].p===pi)))return'No puedes usar el Mercader: no tienes construcciones junto a una loseta de recurso.';
      return null;
    case'deserter':
      if(!opp.some(j=>ks.length>=0&&Object.values(S.knights||{}).some(k=>k.p===j)))return'No puedes usar el Desertor: ningún rival tiene caballeros.';
      return null;
    case'spy':
      if(!opp.some(j=>(S.players[j].prog||[]).length))return'No puedes usar el Espía: ningún rival tiene cartas de progreso.';
      return null;
    case'mmerchant':
      if(!opp.some(j=>vpOf(S,j,false)>myVP&&sumRes(S.players[j].res)))return'No puedes usar el Mercader maestro: nadie con más puntos tiene cartas.';
      return null;
    case'intrigue':
      if(!Object.entries(S.knights||{}).some(([v,k])=>k.p!==pi&&B.verts[v].e.some(e=>S.lines[e]&&S.lines[e].p===pi)))return'No puedes usar la Intriga: no hay caballeros rivales junto a tus caminos.';
      return null;
    case'diplomat':
      if(!openRoads(S,B).length)return'No puedes usar el Diplomático: no hay caminos abiertos.';
      return null;
  }
  return null;
}

    case'build':{

    case'play':{

      if(c==='trademono')return{t:'prog',card:c,res:'coin'};
      if(c==='merchant'){const h=B.hexes.map((x,i)=>i).filter(i=>RES.includes(B.hexes[i].type)&&B.hexes[i].v.some(v=>S.build[v]&&S.build[v].p===pi));if(h.length)return{t:'prog',card:c,h:h[0]}}
      if(c==='mmerchant'){const t=S.players.map((p,i)=>i).find(i=>i!==pi&&vpOf(S,i,false)>myVP&&sumRes(S.players[i].res));if(t!=null)return{t:'prog',card:c,p:t}}
      if(c==='spy'){const t=S.players.map((p,i)=>i).find(i=>i!==pi&&S.players[i].prog.length);if(t!=null){const pref=['mmerchant','resmono','merchant','smith','warlord','roadb','bishop','wedding','trademono','irrigation','mining'];
        const T=S.players[t].prog,take=pref.find(x=>T.includes(x))||T[0];return{t:'prog',card:c,p:t,take}}}
    }
  }
  const goals=botGoals(S,B,pi);
  const afford=goals.filter(g=>(g.free&&(g.k==='road'||g.k==='ship'))||hasRes(P.res,g.cost));
  if(afford.length){
    const g=lv===BOT_LV.easy?afford[Math.floor(rand()*afford.length)]:afford[0];
    if(g.val>=.5||sumRes(P.res)>handLimit(S,pi))return g.a;
  }
  if(lv!==BOT_LV.easy||sumRes(P.res)>=8){
    const off=botMakeOffer(S,B,pi,lv,rand,goals);if(off)return off;
    for(const g of goals.slice(0,3)){if(missing(P.res,g.cost)<=2){const t=botBankTrade(S,B,pi,g,lv);if(t)return t}}
  }
  if(!S.ck&&S.deck&&S.deck.length&&hasRes(P.res,COST.dev)&&lv===BOT_LV.hard)return{t:'buyDev'};
  return{t:'end'};
}
function botDiscard(S,pi,need,rand,lv){
  const B=board(S),P=S.players[pi],K=keysOf(S),top=botGoals(S,B,pi)[0],keep=top?top.cost:{},res={};
  const pool=K.flatMap(k=>Array(P.res[k]).fill(k));
  const sc=k=>(keep[k]?3:0)+(lv===BOT_LV.easy?rand()*4:0)-((P.res[k]-(res[k]||0))*.5);
  for(let i=0;i<need;i++){const opts=K.filter(k=>P.res[k]-(res[k]||0)>0).sort((a,b)=>sc(a)-sc(b));res[opts[0]]=(res[opts[0]]||0)+1}
  return res;
}
/* ---------- trading with people ---------- */
const nearWin=(S,j)=>vpOf(S,j,true)>=targetOf(S)-2;
/* cards to hold on to: whatever the next three goals need */
function keepFor(S,pi){const B=board(S),keep={};botGoals(S,B,pi).slice(0,3).forEach(g=>{for(const[k,q]of Object.entries(g.cost))keep[k]=Math.max(keep[k]||0,q)});return keep}
function surplusOf(S,pi,keep){
  const P=S.players[pi];
  return keysOf(S).filter(k=>P.res[k]-(keep[k]||0)>(COM.includes(k)?1:0)).sort((a,b)=>(P.res[b]-(keep[b]||0))-(P.res[a]-(keep[a]||0)));
}
/* answer someone else's offer: accept, counter or reject */
function botAnswer(S,i,lv,rand){
  const B=board(S),P=S.players[i],o=S.offer;
  const can=hasRes(P.res,o.get);
  if(lv===BOT_LV.easy){if(can&&rand()<.45)return{t:'accept'};return{t:'reject'}}
  if(lv===BOT_LV.hard&&nearWin(S,o.from))return{t:'reject'};
  const v=can?botEvalCards(S,i,o.get,o.give):-9;
  if(can&&v>(lv===BOT_LV.hard?.5:0))return{t:'accept'};
  /* counter: ask only for what I need from what they offered, pay with what I have spare */
  const top=botGoals(S,B,i).find(g=>missing(P.res,g.cost)>0);
  if(top&&(lv===BOT_LV.hard||rand()<.7)){
    const need=needMap(P.res,top.cost),ask={};
    let n=0;for(const k of Object.keys(o.give))if(need[k]&&n<2){const q=Math.min(need[k],o.give[k],2-n);if(q>0){ask[k]=q;n+=q}}
    if(n){
      const keep=keepFor(S,i),sp=surplusOf(S,i,keep),give={};let left=n;
      for(const k of[...Object.keys(o.get).filter(x=>sp.includes(x)),...sp]){if(!left)break;const q=Math.min(left,P.res[k]-(keep[k]||0)-(give[k]||0));if(q>0){give[k]=(give[k]||0)+q;left-=q}}
      const key=o2=>JSON.stringify(Object.entries(o2).filter(([k,q])=>q>0).sort());
      const same=key(give)===key(o.get)&&key(ask)===key(o.give);
      if(!left&&!same&&botEvalCards(S,i,give,ask)>0)return{t:'counter',give,get:ask};
    }
  }
  return{t:'reject'};
}
/* on its own turn: offer a spare card for one it is missing */
function botMakeOffer(S,B,pi,lv,rand,goals){
  if(S.offer)return null;
  const max=lv===BOT_LV.hard?2:1;if((S.offerN||0)>=max)return null;
  if(lv===BOT_LV.easy&&rand()>.3)return null;
  const P=S.players[pi],g=goals.find(x=>{const m=missing(P.res,x.cost);return m>=1&&m<=2&&!x.free});
  if(!g)return null;
  const need=needMap(P.res,g.cost),wants=Object.keys(need).filter(k=>S.players.some((p,j)=>j!==pi&&p.res&&p.res[k]>0));
  if(!wants.length)return null;
  const keep=keepFor(S,pi);for(const[k,q]of Object.entries(g.cost))keep[k]=Math.max(keep[k]||0,q);
  const sp=surplusOf(S,pi,keep);if(!sp.length)return null;
  const want=wants[(S.offerN||0)%wants.length],spare=sp[0];
  const give={[spare]:1};
  if(lv===BOT_LV.hard&&(S.offerN||0)===1&&P.res[spare]-(keep[spare]||0)>=3)give[spare]=2;
  return{t:'offer',give,get:{[want]:1}};
}
/* its own offer is on the table: close the deal, take a counter, keep waiting or withdraw */
function botOwnOffer(S,pi,lv){
  const o=S.offer,others=S.players.length-1;
  const acc=o.acc.filter(j=>!(lv===BOT_LV.hard&&nearWin(S,j))&&hasRes(S.players[j].res,o.get));
  if(acc.length)return{t:'confirm',p:acc[0]};
  const ctr=Object.entries(o.counters||{}).map(([j,c])=>[+j,c,botEvalCards(S,pi,c.get,c.give)])
    .filter(([j,c,v])=>v>(lv===BOT_LV.hard?.5:0)&&hasRes(S.players[pi].res,c.get)&&hasRes(S.players[j].res,c.give)&&!(lv===BOT_LV.hard&&nearWin(S,j)))
    .sort((a,b)=>b[2]-a[2]);
  if(ctr.length)return{t:'takeCounter',p:ctr[0][0]};
  const answered=o.acc.length+o.rej.length+Object.keys(o.counters||{}).length;
  if(answered>=others||Date.now()-(o.at||0)>8000)return{t:'cancelOffer'};
  return{wait:1500};
}
/* the next thing some bot should do, or null */
function botNext(S,rand){
  rand=rand||Math.random;
  if(!S||(S.phase!=='setup'&&S.phase!=='play'))return null;
  if(S.paused!=null)return null;
  const B=board(S),bot=i=>S.players[i]&&S.players[i].bot,lvOf=i=>BOT_LV[S.players[i].bot]||BOT_LV.normal;
  const tryA=(i,a,delay)=>{try{act(S,S.players[i].id,a,()=>.5);return{id:S.players[i].id,a,delay}}catch(e){return null}};
  if(S.phase==='setup'){
    const i=S.cur;if(!bot(i))return null;const lv=lvOf(i),prod=botProfile(S,B,i);
    if(S.step==='setS'){const vs=B.verts.map((v,j)=>j).filter(v=>canSettle(S,B,v,i,true));return tryA(i,{t:'setS',v:pickBest(vs,v=>vScore(S,B,v,i,prod),lv,rand)},900)}
    let es=B.edges.map((e,j)=>j).filter(e=>canLine(S,B,e,i,'road',S.lastV)),kind='road';
    if(!es.length){es=B.edges.map((e,j)=>j).filter(e=>canLine(S,B,e,i,'ship',S.lastV));kind='ship'}
    return tryA(i,{t:'setR',e:pickBest(es,e=>edgeValue(S,B,e,i,prod),lv,rand),kind},700);
  }
  if(S.step==='discard'){for(const k of Object.keys(S.discards)){if(bot(+k)){const r=tryA(+k,{t:'discard',res:botDiscard(S,+k,S.discards[k],rand,lvOf(+k))},600);if(r)return r}}return null}
  /* 5–6 rules: a bot asks for the building phase only when it can already pay for something worth building */
  if(RULES(S).ext56&&S.phase==='play'&&S.step==='main'){
    const ok=['city','settlement','road','ship','knight','improve','dev'];
    for(let i=0;i<S.players.length;i++){
      if(!bot(i)||i===S.cur||(S.sbReq||[]).includes(i))continue;
      const P=S.players[i],g=botGoals(S,B,i).find(g=>ok.includes(g.k)&&hasRes(P.res,g.cost)&&g.val>=1);
      if(g){const r=tryA(i,{t:'sbRequest'},1200);if(r)return r}
    }
  }
  if(S.step==='special'){
    const i=S.sbp;if(!bot(i))return null;const P=S.players[i],lv=lvOf(i);
    const ok=['city','settlement','road','ship','knight','activate','promote','improve','wall','dev'];
    const g=lv===BOT_LV.easy&&rand()<.5?null:botGoals(S,B,i).find(g=>ok.includes(g.k)&&hasRes(P.res,g.cost)&&g.val>=.9);
    return(g&&tryA(i,g.a,700))||tryA(i,{t:'sbPass'},500);
  }
  if(S.step==='sabotage'){for(const k of Object.keys(S.sab.owe)){if(bot(+k)){const r=tryA(+k,{t:'sabDrop',res:botDiscard(S,+k,S.sab.owe[k],rand,lvOf(+k))},900);if(r)return r}}return null}
  if(S.step==='harbor'){for(const k of Object.keys(S.harbor.owe)){if(bot(+k)){const P=S.players[k];const x=COM.filter(c=>P.res[c]).sort((a,b)=>P.res[b]-P.res[a])[0];const r=tryA(+k,{t:'harborGive',res:x},900);if(r)return r}}return null}
  if(S.step==='wedding'){for(const k of Object.keys(S.wedding.owe)){if(bot(+k)){const r=tryA(+k,{t:'give',res:botDiscard(S,+k,S.wedding.owe[k],rand,lvOf(+k))},900);if(r)return r}}return null}
  if(S.step==='gold'){for(const k of Object.keys(S.gold)){if(!bot(+k))continue;const P=S.players[k];let need=Math.min(S.gold[k],RES.reduce((s,x)=>s+S.bank[x],0));const top=botGoals(S,B,+k)[0];const want=top?needMap(P.res,top.cost):{};const res={};
    const order=[...Object.keys(want).filter(x=>RES.includes(x)),'ore','wheat','sheep','brick','wood'];
    for(const x of order){while(need>0&&S.bank[x]>(res[x]||0)&&(res[x]||0)<(want[x]||9)){res[x]=(res[x]||0)+1;need--}}
    const r=tryA(+k,{t:'gold',res},600);if(r)return r}return null}
  if(S.offer&&S.step==='main'){
    for(let i=0;i<S.players.length;i++){
      const o=S.offer;
      if(!bot(i)||i===o.from||o.acc.includes(i)||o.rej.includes(i)||(o.counters&&o.counters[i]))continue;
      const a=botAnswer(S,i,lvOf(i),rand);
      return tryA(i,a,1400)||{id:S.players[i].id,a:{t:'reject'},delay:1400};
    }
  }
  const i=S.cur;if(!bot(i))return null;
  const lv=lvOf(i),a=botTurnAction(S,B,i,lv,rand);if(!a)return null;
  if(a.wait)return{retry:a.wait};
  const delay={roll:1100,robber:900,steal:700}[S.step]||(a.t==='end'?900:800);
  return tryA(i,a,delay)||tryA(i,S.step==='main'?{t:'end'}:{t:'roll'},800);
}

function playProg(c){
  const need=PROG[c].need;U.pcard=c;U.sheet=null;U.spyT=null;U.ho={};
  if(!need)return send({t:'prog',card:c});
  if(need==='hex2'){U.mode='inventor';U.inv=[];return renderGame()}
  if(need==='edge'){U.mode='diplomat';return renderGame()}
  if(need==='knight'){U.mode='intrigue';return renderGame()}
  if(need==='hex'){U.mode='merchant';return renderGame()}
  U.sheet='prog';renderSheet();
}
function boardClick(ev){
  if(!G)return;
  const po=ev.target.closest('[data-po]');if(po){popAct(po.dataset.po);return}
  if(ev.target.closest('.mpop'))return;
  const tap=ev.target.closest('.tap');
  if(tap&&!ev.target.closest('.tgt')){U.pop=tap.dataset.tv!=null?{k:'v',id:+tap.dataset.tv}:{k:'e',id:+tap.dataset.te};renderGame();return}
  const t=ev.target.closest('.tgt');
  if(!t){if(U.pop){U.pop=null;renderGame()}return}
  const S=G,B=board(S),m=U.mode;
  if(t.dataset.h!=null){const h=+t.dataset.h;
    if(m==='inventor'){U.inv.push(h);if(U.inv.length===2)return send({t:'prog',card:'inventor',hs:U.inv});return renderGame()}
    if(m==='merchant')return send({t:'prog',card:'merchant',h});
    return send({t:'robber',h});}
  if(t.dataset.v!=null){const v=+t.dataset.v;
    if(S.phase==='setup')return send({t:'setS',v});
    if(m==='settlement'||m==='city')return send({t:'build',kind:m,v});
    if(m==='knight'||m==='activate'||m==='promote'||m==='wall'||m==='kchase')return send({t:m,v});
    if(m==='kmove'){if(U.kfrom==null){U.kfrom=v;return renderGame()}return send({t:'kmove',v:U.kfrom,to:v})}
    if(m==='intrigue')return send({t:'prog',card:'intrigue',v});
    return;}
  if(t.dataset.e!=null){const e=+t.dataset.e,pi=myIdx();
    if(S.phase==='setup'){const r=canLine(S,B,e,pi,'road',S.lastV);return send({t:'setR',e,kind:r?'road':'ship'})}
    if(m==='diplomat')return send({t:'prog',card:'diplomat',e});
    return send({t:'build',kind:m,e});}
}

function stepper(id,k,val,sub){return`<div class="stp"><span class="sk r-${k}">${resGlyph(k)}</span><span class="sl">${RES_ES[k]}${sub!=null?`<small>${sub}</small>`:''}</span><button data-dn="${id}" aria-label="menos">−</button><span class="q">${val}</span><button data-up="${id}" aria-label="más">+</button></div>`}
function resPick(attr,list,sel,dis){return`<div class="rpick ${list.length===8?'g4':''}">${list.map(k=>`<button data-${attr}="${k}" class="rp r-${k} ${sel===k?'on':''}" ${dis&&dis(k)?'disabled':''}>${resGlyph(k)}<span>${RES_ES[k]}</span></button>`).join('')}</div>`}
function renderSheet(){
  const box=$('#sheet');if(!G||G.phase==='lobby'){box.innerHTML='';return}
  const slot=document.getElementById('dockslot'),wrap=document.getElementById('sheetwrap');
  const shut=()=>{box.innerHTML='';if(wrap)wrap.innerHTML='';if(slot)slot.classList.remove('sheeton');document.querySelector('.g')?.classList.remove('sheeton')};
  const S=G,B=board(S),pi=myIdx(),P=S.players[pi],K=dispKeys(S),mine=actorOf(S)===pi&&S.phase==='play';
  let h='',kind=null;
  const screenish=viewOf()==='screen'||pi<0;
  if(!screenish&&P&&S.step==='discard'&&S.discards?.[pi])kind='discard';
  else if(!screenish&&P&&S.step==='gold'&&S.gold?.[pi])kind='gold';
  else if(!screenish&&P&&S.step==='wedding'&&S.wedding?.owe?.[pi])kind='wedding';
  else if(!screenish&&P&&S.step==='sabotage'&&S.sab?.owe?.[pi])kind='sabotage';
  else if(!screenish&&P&&S.step==='harbor'&&S.harbor?.owe?.[pi])kind='harborGive';
  else if(!screenish&&P&&S.step==='steal'&&S.cur===pi)kind='steal';
  else if(U.sheet==='mesa')kind='mesa';
  else if(U.sheet==='stats'&&S.phase==='over')kind='stats';
  else if(P&&!screenish&&['cards','imp','emo'].includes(U.sheet))kind=U.sheet;
  else if(P&&!screenish&&U.sheet==='counter'&&S.offer&&S.offer.from!==pi)kind='counter';
  else if(U.sheet==='prog'&&U.pcard==='alchemist'){shut();return}
  else if(P&&!screenish&&U.sheet&&mine&&(S.step==='main'||(S.step==='special'&&U.sheet==='knights')))kind=U.sheet;
  else U.sheet=null;
  if(!kind){shut();return}
  const title=(i,t,x)=>`<div class="sh">${ic(i,22)}<h3>${t}</h3>${x===false?'':`<button class="iconb" id="x" aria-label="Cerrar">${ic('close',20)}</button>`}</div>`;
  if(kind==='discard'){
    const need=S.discards[pi],d=U.dd,tot=sumRes(d);
    h=title('cards',`Descarta ${need}`,false)+`<div class="steps">${K.filter(k=>P.res[k]).map(k=>stepper('dd.'+k,k,d[k]||0,`tienes ${P.res[k]}`)).join('')}</div><button class="pri big" id="ok" ${tot===need?'':'disabled'}>${ic('check',20)} Descartar ${tot}/${need}</button>`;
  }else if(kind==='gold'){
    const need=Math.min(S.gold[pi],RES.reduce((s,k)=>s+S.bank[k],0)),d=U.gd,tot=sumRes(d);
    h=title('cards',`Elige ${need} recurso${need>1?'s':''}`,false)+`<div class="lbl">Lo que ya tienes</div>${handHtml(P,true)}<div class="steps">${RES.map(k=>stepper('gd.'+k,k,d[k]||0,`tienes ${P.res[k]}`)).join('')}</div><button class="pri big" id="ok" ${tot===need?'':'disabled'}>${ic('check',20)} Tomar ${tot}/${need}</button>`;
  }else if(kind==='sabotage'){
    const need=S.sab.owe[pi],by=S.players[S.sab.by],d=U.sd,tot=sumRes(d);
    h=title('cards',`Saboteador: descarta ${need}`,false)+`<p class="desc">${esc(by.name)} jugó el Saboteador. Tú eliges qué cartas descartar.</p><div class="steps">${K.filter(k=>P.res[k]).map(k=>stepper('sd.'+k,k,d[k]||0,`tienes ${P.res[k]}`)).join('')}</div><button class="pri big" id="ok" ${tot===need?'':'disabled'}>${ic('check',20)} Descartar ${tot}/${need}</button>`;
  }else if(kind==='harborGive'){
    const got=S.harbor.owe[pi],to=S.players[S.harbor.to];

/* ---------- bots: the host device plays them ---------- */
function lobbyPlayers(){
  const isHost=G.host===ME,M=RULES(G),full=G.players.length>=M.max;
  const rows=G.players.map(p=>`<div class="pl"><span class="dot" style="background:${COLORS[p.color].c}"></span><span class="nm">${esc(p.name)}${p.bot?` <span class="tag bot">bot · ${BOT_LV[p.bot].es}</span>`:''}${p.id===G.host?' <span class="badge">anfitrión</span>':''}${p.id===ME?' <span class="muted small">(tú)</span>':''}</span>${p.bot&&isHost?`<button class="sm" data-rmbot="${p.id}" aria-label="Quitar ${esc(p.name)}">${ic('close',14)}</button>`:`<span class="small muted">${COLORS[p.color].n}</span>`}</div>`).join('');
  const add=isHost?`<div class="addbot"><span class="lbl">Agregar bot</span><div class="tabs">${Object.entries(BOT_LV).map(([k,l])=>`<button data-addbot="${k}" ${full?'disabled':''}>${ic('people',16)} ${l.es}</button>`).join('')}</div>${full?'<span class="small muted">La mesa está llena.</span>':''}</div>`:'';
  return`<div class="players">${rows||'<p class="muted" style="margin:0">Todavía no entra nadie.</p>'}</div>${add}`;

let botT=null,botBusy=false;const botCount={};

function applyVB(){const svg=document.getElementById('bsvg');if(svg&&G)svg.setAttribute('viewBox',viewBoxFor(G,board(G)))}
function setZoom(z,cx,cy){if(U.pop){U.pop=null;const m=document.querySelector('.mpop');if(m)m.remove()}U.zoom=Math.max(1,Math.min(4,z));if(U.zoom<=1.01){U.zoom=1;U.zcx=U.zcy=null}else{if(cx!=null){U.zcx=cx;U.zcy=cy}}applyVB();const zc=document.querySelector('.zoom');if(zc)zc.outerHTML=zoomCtl(),bindZoomBtns()}
function bindZoomBtns(){document.querySelectorAll('[data-z]').forEach(b=>b.onclick=e=>{e.stopPropagation();const z=U.zoom||1;
  if(b.dataset.z==='in')setZoom(z*1.5);else if(b.dataset.z==='out')setZoom(z/1.5);else setZoom(1)})}
function bindZoom(box){
  if(!box)return;bindZoomBtns();
  const pts=new Map();let start=null,moved=false;
  const svgPt=(cx,cy)=>{const svg=document.getElementById('bsvg'),r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
    const sc=Math.min(r.width/vb.width,r.height/vb.height),ox=(r.width-vb.width*sc)/2,oy=(r.height-vb.height*sc)/2;
    return{x:vb.x+(cx-r.left-ox)/sc,y:vb.y+(cy-r.top-oy)/sc,sc}};
  box.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    const vb=document.getElementById('bsvg').viewBox.baseVal;start={z:U.zoom||1,cx:vb.x+vb.width/2,cy:vb.y+vb.height/2,pts:new Map(pts),d:null};
    if(pts.size===2){const[a,b]=[...pts.values()];start.d=Math.hypot(a.x-b.x,a.y-b.y);start.mid=svgPt((a.x+b.x)/2,(a.y+b.y)/2)}});
  box.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!start)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2&&start.d){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);moved=true;setZoom(start.z*d/start.d,start.mid.x,start.mid.y);return}
    const p0=start.pts.get(e.pointerId);if(!p0)return;const dx=e.clientX-p0.x,dy=e.clientY-p0.y;
    if(Math.hypot(dx,dy)>8)moved=true;
    if(moved&&(U.zoom||1)>1.01){const sc=svgPt(0,0).sc;U.zcx=start.cx-dx/sc;U.zcy=start.cy-dy/sc;applyVB()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2&&start)start.d=null;if(!pts.size)setTimeout(()=>{start=null},0)};
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  box.addEventListener('wheel',e=>{if(!e.ctrlKey&&Math.abs(e.deltaY)<4)return;e.preventDefault();const p=svgPt(e.clientX,e.clientY);setZoom((U.zoom||1)*(e.deltaY<0?1.15:1/1.15),p.x,p.y)},{passive:false});
}

/* when the choices sit in one corner of the map (a road next to your new settlement), frame them */
function autoFrame(T,need){
  const B=board(G);
  if(!need){if(U.autoKey){U.autoKey=null;U.zoom=1;U.zcx=U.zcy=null}return}
  const key=(U.mode||G.step)+':'+T.v.join(',')+':'+T.e.join(',')+':'+T.h.join(',');

  const P=[...T.v.map(i=>B.verts[i]),...T.e.map(i=>B.edges[i]),...T.h.map(i=>B.hexes[i])];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
  const f=fitBox(G,B),m=2.2*48,w=(x1-x0)*48+2*m,h=(y1-y0)*48+2*m;

  U.zoom=z;U.zcx=(x0+x1)/2*48;U.zcy=(y0+y1)/2*48;

/* ---------- cards flying into and out of your hand ---------- */
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let lastHand=null,lastCounts=null;
function handTile(k){return document.querySelector(`.g .hand [data-k="${k}"], .gwide .hand [data-k="${k}"]`)}
function badge(x,y,d){
  const b=document.createElement('div');b.className='dbadge '+(d>0?'up':'down');b.textContent=(d>0?'+':'−')+Math.abs(d);
  b.style.left=x+'px';b.style.top=y+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),1400);
}
function pulse(el,cls){if(!el)return;el.classList.remove('bump','dip');void el.offsetWidth;el.classList.add(cls)}
function flyCards(k,d,slot){
  const tile=handTile(k);if(!tile)return;
  const r=tile.getBoundingClientRect(),gain=d>0,count=Math.min(Math.abs(d),3);
  if(!r.width)return;
  const bx=r.left+r.width/2,by=r.top+6;
  if(reduceMotion()){badge(bx,by,d);pulse(tile,gain?'bump':'dip');return}
  const w=Math.max(26,Math.min(44,r.width*.62)),h=w*1.36;
  const tx=r.left+r.width/2-w/2,ty=r.top+r.height/2-h/2;
  const sy=Math.max(56,Math.min(r.top-200,innerHeight*.18));
  let done=0;
  for(let i=0;i<count;i++){
    const c=document.createElement('div');c.className='flycard r-'+k;c.innerHTML=resGlyph(k);
    c.style.width=w+'px';c.style.height=h+'px';document.body.appendChild(c);
    const spread=(i-(count-1)/2)*18,delay=(slot+i)*90;
    const kf=gain
      ?[{transform:`translate(${innerWidth/2-w/2+spread}px,${sy}px) rotate(${spread*.8-8}deg) scale(.7)`,opacity:0},
        {transform:`translate(${(innerWidth/2+tx)/2-w/2+spread}px,${(sy+ty)/2-30}px) rotate(${spread*.4}deg) scale(1.05)`,opacity:1,offset:.45},
        {transform:`translate(${tx}px,${ty}px) rotate(0deg) scale(.9)`,opacity:1}]
      :[{transform:`translate(${tx}px,${ty}px) rotate(0deg) scale(.95)`,opacity:1},
        {transform:`translate(${tx+spread}px,${ty-70}px) rotate(${spread*.6}deg) scale(1)`,opacity:1,offset:.35},
        {transform:`translate(${tx+spread*2.2}px,${ty-190}px) rotate(${spread*1.4}deg) scale(.6)`,opacity:0}];
    const an=c.animate(kf,{duration:gain?560:620,delay,easing:gain?'cubic-bezier(.25,.8,.35,1)':'cubic-bezier(.45,0,.8,.5)',fill:'both'});
    const finish=()=>{c.remove();if(gain){pulse(handTile(k),'bump');if(++done===count)badge(bx,by,d)}};
    an.onfinish=finish;an.oncancel=()=>c.remove();
  }
  if(!gain){pulse(tile,'dip');badge(bx,by,d)}
}
function animateHand(){
  const pi=myIdx(),P=G&&G.players[pi];
  if(!P||!P.res){lastHand=null;return}
  const key=G.code+':'+P.id,now={...P.res};
  const prev=lastHand&&lastHand.key===key?lastHand.res:null;
  lastHand={key,res:now};
  if(!prev)return;
  let slot=0;
  keysOf(G).forEach(k=>{const d=(now[k]||0)-(prev[k]||0);if(!d)return;flyCards(k,d,slot);slot+=Math.min(Math.abs(d),3)});
}
/* on the table screen: each player's card count shows +N / −N */
function animateCounts(){
  if(!G||!G.players||G.phase==='lobby'){lastCounts=null;return}
  const now={};G.players.forEach(p=>now[p.id]=p.res?sumRes(p.res):0);
  const prev=lastCounts&&lastCounts.code===G.code?lastCounts.c:null;
  lastCounts={code:G.code,c:now};
  if(!prev)return;
  G.players.forEach(p=>{const d=now[p.id]-(prev[p.id]||0);if(!d)return;
    const el=document.querySelector(`[data-cc="${p.id}"]`);if(!el)return;

}

/* ---------- why the winner won ---------- */
function vpBreakdown(S,i){
  const c=countPieces(S,i),P=S.players[i],L=[];
  if(c.settlement)L.push(['settlement',`${c.settlement} poblado${c.settlement>1?'s':''}`,c.settlement]);
  if(c.city)L.push(['city',`${c.city} ciudad${c.city>1?'es':''}`,2*c.city]);
  Object.values(S.build).filter(b=>b.p===i&&b.metro).forEach(b=>L.push(['improve',`Metrópolis de ${TRACK_ES[b.metro]}`,2]));
  if(S.longest===i)L.push(['road',`Ruta más larga (${(S.roadLen||[])[i]||5})`,2]);
  if(S.army===i)L.push(['knight',`Ejército más grande (${P.knights})`,2]);
  if((P.islands||[]).length)L.push(['ship',`${P.islands.length} isla${P.islands.length>1?'s':''} nueva${P.islands.length>1?'s':''}`,2*P.islands.length]);
  const dv=[...(P.dev||[]),...(P.newDev||[])].filter(d=>d==='vp').length;if(dv)L.push(['dev',`${dv} carta${dv>1?'s':''} de punto`,dv]);
  const cnt={};(P.vpc||[]).forEach(x=>cnt[x]=(cnt[x]||0)+1);
  Object.entries(cnt).forEach(([x,n])=>L.push([x==='defender'?'knight':'dev',x==='defender'?`Defensor de la isla${n>1?' ×'+n:''}`:`${PROG[x].es}${n>1?' ×'+n:''}`,n]));
  if(S.merchant&&S.merchant.p===i)L.push(['trade','Mercader',1]);
  return L;
}

  const P=S.players[i],L=vpBreakdown(S,i),tot=L.reduce((t,x)=>t+x[2],0),top=[...L].sort((a,b)=>b[2]-a[2])[0];
  return`<div class="why ${compact?'compact':''}"><div class="wh">${ic('trophy',18)} ¿Por qué ganó ${lp(P.name)}?</div>

}

function filterRecs(recs){

function rankingOf(recs,withBots){
  const by={};
  [...recs].sort((a,b)=>a.at-b.at).forEach(r=>r.players.forEach(p=>{
    if(p.bot&&!withBots)return;
    const k=p.bot?'bot:'+normName(p.name):keyOf(p.name);
    const x=by[k]=by[k]||{k,name:p.name,bot:p.bot,games:0,wins:0,pos:0,vp:0,streak:0,best:0,last:0};
    x.name=p.name;x.games++;x.pos+=p.pos;x.vp+=p.vp;x.last=r.at;
    if(p.win){x.wins++;x.streak++;x.best=Math.max(x.best,x.streak)}else x.streak=0;
  }));
  return Object.values(by).map(x=>({...x,pct:x.games?x.wins/x.games:0,avgPos:x.games?x.pos/x.games:0,avgVp:x.games?x.vp/x.games:0}))
    .sort((a,b)=>b.wins-a.wins||b.pct-a.pct||a.avgPos-b.avgPos||b.games-a.games);
}
function recordsOf(recs,withBots){
  const out=[];const ok=p=>withBots||!p.bot;
  const best=(label,icon,get,better,fmt)=>{let w=null;recs.forEach(r=>r.players.forEach(p=>{if(!ok(p))return;const v=get(p,r);if(v==null)return;if(!w||better(v,w.v))w={v,p,r}}));if(w)out.push({label,icon,w,fmt})};
  best('Victoria más rápida','dice',(p,r)=>p.win&&r.turns?r.turns:null,(a,b)=>a<b,v=>`${v} turnos`);
  best('Más puntos en una partida','star',p=>p.vp,(a,b)=>a>b,v=>`${v} puntos`);
  best('Más recursos en una partida','cards',p=>p.prod||null,(a,b)=>a>b,v=>`${v} cartas`);
  best('Más robos en una partida','robber',p=>p.stole||null,(a,b)=>a>b,v=>`${v} robos`);
  best('Más intercambios en una partida','trade',p=>p.trades||null,(a,b)=>a>b,v=>`${v} cambios`);
  return out;
}

/* ---------- networking: the screen (host) keeps the game; phones send actions to it ---------- */
function resetLocal(a){if(a.t!=='join'){U.mode=null;U.kfrom=null;U.inv=[];U.pcard=null}}
async function send(a){
  if(!G)return;
  if(isHost){const keep={mode:U.mode,kfrom:U.kfrom,inv:U.inv,pcard:U.pcard};resetLocal(a);const e=hostApply(ME,a);if(e){Object.assign(U,keep);toast(e);render()}return}
  if(!hostConn||!hostConn.open){toast('Sin conexión con la pantalla. Reconectando…');return}
  if(busy)return;busy=true;clearTimeout(pendingT);pendingT=setTimeout(()=>{busy=false},6000);
  hostConn.send({type:'act',a,pid:ME});resetLocal(a);
}
function saveHost(){
  if(G.phase==='closed')return;
  lsSet('hx-host-'+G.code,G);
  const list=lsGet('hx-hosted',[]).filter(c=>c!==G.code);list.unshift(G.code);
  list.slice(10).forEach(c=>{try{localStorage.removeItem('hx-host-'+c)}catch(e){}});
  lsSet('hx-hosted',list.slice(0,10));
}
function broadcast(){const m={type:'state',S:G};conns.forEach(c=>{try{if(c.open)c.send(m)}catch(e){}})}
function hostApply(pid,a){try{G=act(G,pid,a);saveHost();broadcast();render();return null}catch(e){return e.message||'No se pudo.'}}
function startHost(S){
  closeNet();isHost=true;G=S;U.code=S.code;U.view=null;U.net='connecting';saveHost();
  if(viewOf()==='screen')keepAwake();
  if(!window.Peer){U.net='nolib';render();return}
  peer=new Peer(PEER_PREFIX+S.code);
  peer.on('open',()=>{U.net='ok';render()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){U.net='taken';toast('Este código ya está abierto en otra pantalla.')}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){U.net='lost'}
    render();
  });
  peer.on('disconnected',()=>{U.net='lost';render();setTimeout(()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
  peer.on('connection',c=>{
    c.on('open',()=>{conns.push(c);c.send({type:'state',S:G});render()});
    c.on('data',m=>{if(m&&m.type==='act'&&typeof m.pid==='string'){const e=hostApply(m.pid,m.a);if(e)try{c.send({type:'err',msg:e})}catch(_){}}});
    c.on('close',()=>{conns=conns.filter(x=>x!==c);render()});
  });
  render();
}
function joinRemote(code,asScreen){
  code=(code||'').toUpperCase().trim();if(!/^[A-Z]{5}$/.test(code)){toast('El código tiene 5 letras.');return}
  closeNet();isHost=false;U.code=code;U.view=null;G=null;joinedOnce=false;
  if(asScreen){U.view='screen';try{localStorage.setItem('hx-view-'+code,'screen')}catch(e){};keepAwake()}
  lsSet('hx-last',code);
  if(!window.Peer){U.net='nolib';render();return}
  U.net='connecting';render();
  peer=new Peer();
  peer.on('open',connect);
  peer.on('error',e=>{if(e.type==='peer-unavailable'){U.net='nohost';render();retry()}else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){U.net='lost';render();retry()}});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
}
function connect(){
  if(!peer||peer.destroyed||isHost||!U.code)return;
  if(hostConn)try{hostConn.close()}catch(e){}
  const c=peer.connect(PEER_PREFIX+U.code,{reliable:true});hostConn=c;
  c.on('open',()=>{U.net='ok';render()});
  c.on('data',m=>{
    if(m.type==='state'){busy=false;G=m.S;
      if(G.phase==='lobby'&&!G.pids.includes(ME)&&viewOf()!=='screen'&&!joinedOnce){joinedOnce=true;send({t:'join',name:U.name.trim()||'Jugador'})}
      render()}
    else if(m.type==='err'){busy=false;toast(m.msg)}
  });
  c.on('close',()=>{if(hostConn===c){U.net='lost';render();retry()}});
}
function retry(){clearTimeout(retry.t);retry.t=setTimeout(()=>{if(U.code&&!isHost&&peer&&!peer.destroyed){if(peer.disconnected)try{peer.reconnect()}catch(e){};connect()}},2500)}
function closeNet(){clearTimeout(retry.t);try{if(hostConn)hostConn.close()}catch(e){}hostConn=null;conns.forEach(c=>{try{c.close()}catch(e){}});conns=[];try{if(peer)peer.destroy()}catch(e){}peer=null;isHost=false}

function netPill(){
  if(isHost){const n=conns.filter(c=>c.open).length;
    if(U.net==='ok')return`<span class="net">Aquí vive la partida · ${n} teléfono${n===1?'':'s'} conectado${n===1?'':'s'}</span>`;

}

function renderLobby(){
  setGameMode(false);$('#sheet').innerHTML='';
  const M=RULES(G),isHost=G.host===ME,inG=G.pids.includes(ME);
  if(viewOf()==='screen'){
    $('#app').innerHTML=`
    <div class="top"><div class="row"><button id="back">← Salir</button><h2>Hexterra · mesa</h2>${fsBtn()}${netPill()}</div><span class="muted small">${esc(modeName(G))} · gana con ${targetOf(G)}</span></div>
    <div class="home">
     <section class="card" style="gap:16px">
       <div class="lbl">Entren desde su teléfono</div>
       <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:clamp(15px,1.4vw,20px)">
         <li>Escaneen este QR con la cámara del teléfono (o abran ${esc(location.host+location.pathname)}).</li>
         <li>Escriban su nombre y, si no se llenó solo, este código.</li>
         <li>Toquen <b>Unirme a jugar</b>. Sus cartas aparecen en su teléfono; el tablero, aquí.</li>
       </ol>
       <div class="row" style="gap:24px;align-items:center"><div class="qr" id="qr"></div><div class="lobbycode" style="font-size:clamp(56px,10vw,120px)">${G.code}</div></div>
       ${isHost?`<button class="pri" id="start" ${G.players.length<M.min?'disabled':''}>Empezar partida (${G.players.length} jugador${G.players.length===1?'':'es'})</button>`:`<p class="small muted" style="margin:0">Quien abrió la mesa empieza la partida.</p>`}
       ${G.players.length<M.min?`<p class="small muted" style="margin:0">Faltan ${M.min-G.players.length} para poder empezar (${M.min}–${M.max} jugadores).</p>`:''}
     </section>
     <section class="card"><div class="lbl">En la mesa</div>
       ${lobbyPlayers()}${lobbySettings()}
       ${inG?'':`<button id="jn">También juego desde este dispositivo</button>`}
       ${tableRanking()}
     </section>
    </div>`;
    $('#back').onclick=closeGame;bindFS();drawQR($('#qr'),G.code);bindLobbyBots();bindLobbySettings();
    if($('#start'))$('#start').onclick=()=>send({t:'start'});
    if($('#jn'))$('#jn').onclick=()=>{setView('player');send({t:'join',name:U.name.trim()||'Jugador'})};
    return;
  }
  $('#app').innerHTML=`
  <div class="top"><button id="back">← Salir</button>${netPill()}<span class="muted small">${esc(modeName(G))} · gana con ${targetOf(G)}</span></div>
  <div class="home">
   <section class="card">
     <div class="lbl">Código de la partida</div>
     <div class="row" style="justify-content:space-between"><div class="lobbycode">${G.code}</div><button id="copy">Copiar código</button></div>
     <p class="muted small" style="margin:0">Tus amigos escanean el QR o abren ${esc(location.host+location.pathname)}, escriben su nombre y este código. ${M.min}–${M.max} jugadores.</p><div class="qr" id="qr"></div>
     ${inG?'':`<button class="pri" id="jn">Entrar a la partida</button>`}
     ${isHost?`<button class="pri" id="start" ${G.players.length<M.min?'disabled':''}>Empezar partida (${G.players.length} jugador${G.players.length===1?'':'es'})</button>`:`<p class="small muted" style="margin:0">Esperando a que ${esc(G.players.find(p=>p.id===G.host)?.name||'el anfitrión')} empiece.</p>`}
     ${inG?`<button id="lv">Dejar la sala</button>`:''}
   </section>
   <section class="card"><div class="lbl">En la sala</div>
     ${lobbyPlayers()}${lobbySettings()}
     <p class="small muted" style="margin:0">El orden de turno se sortea al empezar.${G.ck?' En Ciudades y caballeros tu segunda colocación es una ciudad.':''}</p>
   </section>
  </div>`;
  $('#back').onclick=closeGame;drawQR($('#qr'),G.code);bindLobbyBots();bindLobbySettings();
  $('#copy').onclick=()=>{try{navigator.clipboard.writeText(G.code).then(()=>toast('Código copiado'),()=>toast('Código: '+G.code))}catch(e){toast('Código: '+G.code)}};
  if($('#jn'))$('#jn').onclick=()=>send({t:'join',name:U.name.trim()||'Jugador'});
  if($('#start'))$('#start').onclick=()=>send({t:'start'});
  if($('#lv'))$('#lv').onclick=async()=>{await send({t:'leave'});closeGame()};
}


/* ---------- boot ---------- */
(function boot(){
  const c=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
  if(/^[A-Z]{5}$/.test(c)){U.pre=c;history.replaceState(null,'',location.pathname);if(U.name.trim()){U.pre=null;joinRemote(c);return}}
  renderHome();
})();

let lastTimeout=0;
function onTimeUp(left){if(!isHost||Date.now()-lastTimeout<2500)return;lastTimeout=Date.now();const e=hostApply(ME,{t:'timeout'});if(e&&!/tiempo/i.test(e))console.warn(e)}

const amBotHost=()=>isHost;
async function sendAs(id,a){const e=hostApply(id,a);if(e)console.warn('bot:',e)}

const INSTALL_HINT=/iPhone|iPad|iPod/.test(navigator.userAgent)?'En iPhone: toca Compartir y luego "Agregar a inicio". Desde ese ícono el juego abre sin barras.':'';

/* ---------- history lives in this device ---------- */
const HISTORY_WHERE='en este dispositivo';
function histLocal(){try{return JSON.parse(localStorage.getItem('hx-history')||'[]')}catch(e){return[]}}
async function loadHistory(){return histLocal()}
function saveRecord(rec){const h=histLocal();if(h.some(r=>r.id===rec.id))return;h.push(rec);while(h.length>500)h.shift();try{localStorage.setItem('hx-history',JSON.stringify(h))}catch(e){}}
function tableRanking(){return miniRanking(histLocal(),5)}
function HISTORY_TOOLS(){return`<div class="card hx"><div class="lbl">Llevar el historial a otro dispositivo</div>
  <p class="desc">Descarga el archivo y ábrelo con "Importar" en el otro dispositivo. Las partidas repetidas no se duplican.</p>
  <div class="row"><button id="hexp">${ic('exit',16)} Exportar</button><label class="btnlike" for="himp">${ic('hist',16)} Importar</label><input type="file" id="himp" accept="application/json,.json" hidden></div></div>`}
function HISTORY_BIND(all){
  $('#hexp').onclick=()=>{try{const blob=new Blob([JSON.stringify({hexterra:1,games:histLocal(),alias:aliases()})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hexterra-historial.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('No se pudo exportar.')}};
  $('#himp').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);const add=(d.games||d||[]).filter(r=>r&&r.id&&r.players);const h=histLocal(),ids=new Set(h.map(r=>r.id));let n=0;add.forEach(r=>{if(!ids.has(r.id)){h.push(r);n++}});h.sort((a,b)=>a.at-b.at);try{localStorage.setItem('hx-history',JSON.stringify(h.slice(-500)));if(d.alias)localStorage.setItem('hx-alias',JSON.stringify({...d.alias,...aliases()}))}catch(_){}toast(n?`Se agregaron ${n} partida${n>1?'s':''}.`:'No había partidas nuevas.');renderHistory()}catch(err){toast('Ese archivo no es un historial de Hexterra.')}};rd.readAsText(f)};
}
</script>
</body>
</html>
